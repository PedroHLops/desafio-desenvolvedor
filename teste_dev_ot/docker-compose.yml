version: "3.8"
services:
  # APLICAÇÃO WEB (já funciona)
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    image: sail-8.4/app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
    volumes:
      - ".:/var/www/html"
    networks:
      - sail
    depends_on:
      - mysql
      - mongodb
      - redis

  # ✅ ADICIONE ESTE WORKER (para processar Redis Queue)
  laravel-worker:
    image: sail-8.4/app
    restart: unless-stopped
    depends_on:
      - redis
      - mysql
    volumes:
      - ".:/var/www/html"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=60", "--sleep=3"]
    networks:
      - sail

  mysql:
    image: "mysql:8.0"
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-password}"
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
    volumes:
      - "sail-mysql:/var/lib/mysql"
      - "./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf"
      # ❌ REMOVA: - "./docker/supervisor:/etc/supervisor/conf.d"
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-password}"]
      retries: 3
      timeout: 5s

  mongodb:
    image: "mongo:latest"
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "sail"
      MONGO_INITDB_ROOT_PASSWORD: "password"
      MONGO_INITDB_DATABASE: "laravel"
    volumes:
      - "sail-mongodb:/data/db"
    networks:
      - sail

  redis:
    image: "redis:alpine"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "sail-redis:/data"
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  sail-mongodb:
    driver: local
  sail-redis:
    driver: local