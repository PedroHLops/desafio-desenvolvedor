version: "3.8"
services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.2
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
    image: sail-8.2/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
      PHP_UPLOAD_MAX_FILESIZE: 10M
      PHP_POST_MAX_SIZE: 12M
      PHP_MAX_FILE_UPLOADS: 20
    volumes:
      - ".:/var/www/html"
      - "./docker/php/conf.d/custom.ini:/usr/local/etc/php/conf.d/custom.ini" # ← ADICIONE ESTA LINHA
    networks:
      - sail
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: "mongo:latest"
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "sail"
      MONGO_INITDB_ROOT_PASSWORD: "password"
      MONGO_INITDB_DATABASE: "laravel"
    volumes:
      - "sail-mongodb:/data/db"
    networks:
      - sail

  redis:
    image: "redis:alpine"
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "sail-redis:/data"
    networks:
      - sail

networks:
  sail:
    driver: bridge

volumes:
  sail-mongodb:
    driver: local
  sail-redis:
    driver: local
